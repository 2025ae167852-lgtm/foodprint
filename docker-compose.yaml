version: "3.9"

services:
  foodprint-database:
    image: mysql:8.0
    container_name: foodprint-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword   # change this to something secure
      MYSQL_DATABASE: foodprint           # your database name
      MYSQL_USER: foodprint_user          # optional app user
      MYSQL_PASSWORD: foodprint_pass      # optional app user password
    ports:
      - "3307:3306"   # host:container mapping (avoids conflict with local MySQL)
    volumes:
      - db_data:/var/lib/mysql   # persistent storage

volumes:
  db_data:
